# Publicação no GitHub Pages a cada push na main (ou manualmente).
#
# A configuração do Firebase vem dos secrets do repositório (Settings > Secrets and
# variables > Actions). Sem eles, o site é publicado no modo local (lowdb no
# navegador). Passo a passo em docs/02-tecnologias.md, seção "Publicação".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verificação e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run check
      - name: Build da web
        run: npm run build
        env:
          # Subcaminho do Pages (/nome-do-repositorio/ ou / com domínio próprio).
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          # Variável opcional do repositório: auto (padrão), firebase ou local.
          VITE_DATA_MODE: ${{ vars.DATA_MODE || 'auto' }}
      # O Pages não conhece as rotas do React Router: o 404.html devolve o app.
      - name: Fallback das rotas
        run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  firestore:
    name: Regras e índices do Firestore
    needs: build
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
    steps:
      - name: Conta de serviço ausente
        if: env.FIREBASE_SERVICE_ACCOUNT == ''
        run: echo "::warning::Secret FIREBASE_SERVICE_ACCOUNT ausente, regras do Firestore não publicadas. Publique firestore.rules e firestore.indexes.json pelo console ou pela CLI (docs/02-tecnologias.md, seção 2.6); sem elas o banco fica com as regras de quando foi criado."
      - uses: actions/checkout@v5
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
      - name: Publicar regras e índices
        if: env.FIREBASE_SERVICE_ACCOUNT != ''
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/conta-de-servico.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/conta-de-servico.json"
          npx --yes firebase-tools@15.31.0 deploy --only firestore:rules,firestore:indexes --project "$FIREBASE_PROJECT_ID" --non-interactive
